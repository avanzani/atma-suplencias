<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atma Yoga — Sistema de Turnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --c1: #635F54;
  --c2: #887A5F;
  --c3: #C1937B;
  --c4: #A8AC8B;
  --c5: #D8C6B2;
  --c6: #D6D6CB;
  --c7: #D2C7C5;
  --c8: #EAE5E5;
  --bg:   #F7F4F0;
  --bg2:  #EFEBE4;
  --bg3:  #E8E2D9;
  --card: #FDFBF8;
  --border: rgba(99,95,84,0.12);
  --border2: rgba(99,95,84,0.22);
  --text:  #3A3830;
  --text2: #635F54;
  --text3: #9B9588;
  --accent: #C1937B;
  --accent2: #A87860;
  --green: #6B8C6B;
  --green-dim: rgba(107,140,107,0.12);
  --red: #B05A5A;
  --red-dim: rgba(176,90,90,0.10);
  --amber: #887A5F;
  --amber-dim: rgba(136,122,95,0.12);
  --sage: #A8AC8B;
  --sage-dim: rgba(168,172,139,0.15);
  --radius: 10px;
  --radius-lg: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Jost', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
h1,h2,h3,.serif { font-family: 'Cormorant Garamond', serif; }

.shell { max-width: 1120px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

/* Header */
.header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border2); flex-wrap: wrap; gap: 1rem; }
.logo h1 { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; color: var(--c1); }
.logo h1 em { font-style: italic; color: var(--accent); }
.logo p { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text3); margin-top: 3px; font-weight: 400; }
.save-pill { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border2); margin-bottom: 2rem; }
.tab { padding: 9px 22px; font-size: 12px; font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase; border: none; background: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; font-family: 'Jost', sans-serif; }
.tab:hover { color: var(--text2); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 2rem; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; }
.stat-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.stat-value { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; color: var(--text); line-height: 1; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
.stat.accent .stat-value { color: var(--accent); }

/* Section */
.section { display: none; }
.section.active { display: block; }

/* Week nav */
.week-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
.wn-btn { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 6px 14px; cursor: pointer; color: var(--text2); font-size: 13px; font-family: 'Jost', sans-serif; }
.wn-btn:hover { background: var(--bg2); }
.wn-label { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 300; color: var(--text); min-width: 200px; text-align: center; }
.week-mode { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.week-mode-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid; }
.badge-normal { background: var(--sage-dim); color: var(--c1); border-color: rgba(168,172,139,0.3); }
.badge-suplencia { background: rgba(193,147,123,0.15); color: var(--accent2); border-color: rgba(193,147,123,0.3); }

/* Schedule */
.sched-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.sched-head { display: grid; grid-template-columns: 170px repeat(7,1fr); background: var(--bg2); border-bottom: 1px solid var(--border2); }
.sh-cell { padding: 10px 6px; text-align: center; font-size: 10px; font-weight: 500; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; border-right: 1px solid var(--border); }
.sh-cell:first-child { text-align: left; padding-left: 16px; }
.sh-cell:last-child { border-right: none; }
.sh-cell .date { display: block; font-family: 'Cormorant Garamond', serif; font-size: 14px; font-weight: 300; color: var(--text2); text-transform: none; letter-spacing: 0; margin-top: 2px; }
.sh-cell.today { color: var(--accent); }
.sh-cell.today .date { color: var(--accent); }
.sh-cell.wknd .date { color: var(--sage); }

.sched-row { display: grid; grid-template-columns: 170px repeat(7,1fr); border-bottom: 1px solid var(--border); }
.sched-row:last-child { border-bottom: none; }
.row-lbl { padding: 10px 16px; background: var(--bg2); border-right: 1px solid var(--border2); display: flex; flex-direction: column; gap: 3px; }
.row-lbl-name { font-size: 12px; font-weight: 500; color: var(--text); letter-spacing: 0.3px; }
.row-lbl-sub { font-size: 10px; color: var(--text3); }
.grid-cell { border-right: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 6px 4px; min-height: 54px; cursor: pointer; transition: background 0.1s; position: relative; }
.grid-cell:last-child { border-right: none; }
.grid-cell:hover { background: var(--bg2); }
.grid-cell.dimmed { background: var(--bg); cursor: default; }
.grid-cell.dimmed:hover { background: var(--bg); }
.grid-cell.is-suplencia::after { content:'S'; position:absolute; top:3px; right:4px; font-size:9px; color:var(--accent); font-weight:500; opacity:0.7; }

.slot { border-radius: 7px; padding: 5px 7px; font-size: 11px; font-weight: 400; width: 100%; text-align: center; line-height: 1.3; letter-spacing: 0.2px; }
.slot-fijo    { background: rgba(210,199,197,0.5);  color: var(--c1);    border: 1px solid rgba(210,199,197,0.8); }
.slot-hora-pol{ background: rgba(193,147,123,0.15); color: var(--accent2); border: 1px solid rgba(193,147,123,0.25); }
.slot-hora-rom{ background: var(--sage-dim);        color: #6B7055;      border: 1px solid rgba(168,172,139,0.35); }
.slot-socio   { background: rgba(136,122,95,0.12);  color: var(--c2);    border: 1px solid rgba(136,122,95,0.2); }
.slot-owner   { background: var(--green-dim);       color: var(--green); border: 1px solid rgba(107,140,107,0.25); }
.slot-extra   { background: rgba(216,198,178,0.4);  color: var(--c1);    border: 1px solid rgba(216,198,178,0.7); }
.slot-event   { background: rgba(168,172,139,0.2);  color: #5A5E45;      border: 1px dashed rgba(168,172,139,0.5); }
.slot-vacant  { background: var(--red-dim);         color: var(--red);   border: 1px dashed rgba(176,90,90,0.25); font-size: 10px; }
.slot-add     { color: var(--text3); font-size: 10px; border: 1px dashed var(--border2); border-radius: 7px; padding: 5px 7px; width: 100%; text-align: center; }

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1rem; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
.leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(58,56,48,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(3px); }
.modal { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 2rem; width: 400px; max-width: 95vw; box-shadow: 0 20px 60px rgba(99,95,84,0.15); }
.modal h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; margin-bottom: 4px; color: var(--text); }
.modal-sub { font-size: 12px; color: var(--text3); margin-bottom: 1.5rem; letter-spacing: 0.3px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius);
  padding: 9px 12px; font-size: 13px; color: var(--text); font-family: 'Jost', sans-serif;
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.5rem; }
.btn { padding: 8px 20px; border-radius: var(--radius); font-size: 12px; font-weight: 500; letter-spacing: 0.5px; cursor: pointer; border: 1px solid var(--border2); background: var(--bg2); color: var(--text); font-family: 'Jost', sans-serif; }
.btn:hover { background: var(--bg3); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent2); }
.btn-danger { color: var(--red); border-color: rgba(176,90,90,0.25); background: var(--red-dim); }
.btn-danger:hover { background: rgba(176,90,90,0.18); }

/* Toggle suplencia */
.toggle-wrap { display: flex; align-items: center; gap: 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
.toggle-wrap label { font-size: 12px; color: var(--text2); flex: 1; }
.toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--border2); border-radius: 20px; cursor: pointer; transition: 0.2s; }
.toggle-slider:before { content:''; position:absolute; height:14px; width:14px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:0.2s; }
.toggle input:checked + .toggle-slider { background: var(--accent); }
.toggle input:checked + .toggle-slider:before { transform: translateX(16px); }

/* Events */
.events-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.events-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 300; }
.btn-add { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 9px 18px; font-size: 12px; font-weight: 500; letter-spacing: 0.5px; cursor: pointer; font-family: 'Jost', sans-serif; }
.btn-add:hover { background: var(--accent2); }
.events-list { display: flex; flex-direction: column; gap: 12px; }
.event-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 22px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ev-badge { background: rgba(193,147,123,0.15); border: 1px solid rgba(193,147,123,0.25); border-radius: var(--radius); padding: 10px 14px; text-align: center; min-width: 58px; }
.ev-badge .eday { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; color: var(--accent); line-height: 1; }
.ev-badge .emon { font-size: 9px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
.ev-info { flex: 1; min-width: 160px; }
.ev-info h3 { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 300; margin-bottom: 4px; }
.ev-info p { font-size: 12px; color: var(--text3); }
.ev-meta { display: flex; gap: 20px; }
.ev-stat .val { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--text); }
.ev-stat .lbl { font-size: 10px; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; }
.ev-actions button { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; color: var(--text2); font-size: 14px; }
.ev-actions button:hover { color: var(--red); border-color: rgba(176,90,90,0.3); background: var(--red-dim); }
.empty-box { text-align: center; padding: 3rem; color: var(--text3); border: 1px dashed var(--border2); border-radius: var(--radius-lg); }
.empty-box p { margin-bottom: 1rem; font-size: 13px; }

/* Nomina */
.nom-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.nom-controls label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); }
.nom-controls input[type=month], .nom-controls input[type=date] { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 7px 12px; font-size: 13px; color: var(--text); font-family: 'Jost', sans-serif; }
.nom-controls input:focus { outline: none; border-color: var(--accent); }
.nom-sep { font-size: 13px; color: var(--text3); }

.nom-section { margin-bottom: 2rem; }
.nom-section h3 { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 300; color: var(--text2); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.nom-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.nom-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; font-family: 'Jost', sans-serif; }
.nom-table td { padding: 12px 12px; border-top: 1px solid var(--border); color: var(--text); vertical-align: middle; }
.nom-table tr:first-child td { border-top: none; }
.nom-table .total-row td { font-weight: 500; font-size: 14px; border-top: 2px solid var(--border2) !important; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; }

.total-banner { background: linear-gradient(135deg, rgba(193,147,123,0.12), rgba(168,172,139,0.1)); border: 1px solid rgba(193,147,123,0.25); border-radius: var(--radius-lg); padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; margin-top: 2rem; }
.total-banner .lbl { font-size: 12px; color: var(--text3); letter-spacing: 0.5px; }
.total-banner .periodo { font-size: 11px; color: var(--text3); margin-top: 3px; }
.total-banner .val { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--accent2); }

.divider { height: 1px; background: var(--border); margin: 1.5rem 0; }
.desglose { display: flex; gap: 24px; margin-top: 8px; font-size: 12px; color: var(--text3); flex-wrap: wrap; }
.desglose span { display: flex; align-items: center; gap: 5px; }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--green); color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 12px; letter-spacing: 0.3px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 300; }
.toast.show { opacity: 1; }

/* Suplencia panel in modal */
.info-box { background: rgba(193,147,123,0.08); border: 1px solid rgba(193,147,123,0.2); border-radius: var(--radius); padding: 10px 14px; font-size: 12px; color: var(--text2); margin-bottom: 14px; line-height: 1.6; }

@media print {
  body { background: #FDFBF8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .shell { padding: 1rem; max-width: 100%; }
  .tabs, .week-nav button, .save-pill, .legend, #nomina-controls-extra { display: none !important; }
  .stats { display: none !important; }
  .week-nav { justify-content: center; margin-bottom: 0.5rem; }
  .wn-label { font-size: 22px; text-align: center; min-width: unset; }
  .section { display: block !important; }
  #tab-events, #tab-nomina { display: none !important; }
  .sched-wrap { border: 1px solid #ccc; }
  .slot { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .grid-cell { min-height: 44px; }
  .header { margin-bottom: 1rem; padding-bottom: 1rem; }
}
</style>
</head>
<body>
<div class="shell">

  <div class="header">
    <div class="logo">
      <h1>AT<em>MA</em></h1>
      <p>Sistema de turnos y nomina &nbsp;·&nbsp; Roma &amp; Polanco</p>
    </div>
    <div class="save-pill"><div class="save-dot"></div><span id="save-status">Cargando...</span></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('calendar',this)">Calendario</button>
    <button class="tab" onclick="showTab('events',this)">Eventos especiales</button>
    <button class="tab" onclick="showTab('nomina',this)">Nomina</button>
  </div>

  <div class="stats" id="stats"></div>

  <!-- CALENDARIO -->
  <div class="section active" id="tab-calendar">
    <div class="week-nav">
      <button class="wn-btn" onclick="changeWeek(-1)">&#8592;</button>
      <span class="wn-label" id="week-label"></span>
      <button class="wn-btn" onclick="changeWeek(1)">&#8594;</button>
      <button class="wn-btn" onclick="printCalendar()" style="margin-left:8px;display:flex;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Imprimir / Compartir
      </button>
      <div class="week-mode">
        <span id="week-mode-badge" class="week-mode-badge badge-normal">Turnos base</span>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="sched-wrap">
      <div class="sched-head" id="sched-head"></div>
      <div id="sched-body"></div>
    </div>
    <p style="font-size:11px;color:var(--text3);margin-top:10px;letter-spacing:0.3px;">Clic en una celda para asignar turno. Puedes marcar cambios como suplencia temporal sin afectar el patron base.</p>
  </div>

  <!-- EVENTOS -->
  <div class="section" id="tab-events">
    <div class="events-header">
      <h2>Eventos y talleres especiales</h2>
      <button class="btn-add" onclick="openEventModal()">+ Nuevo evento</button>
    </div>
    <div class="events-list" id="events-list"></div>
  </div>

  <!-- NOMINA -->
  <div class="section" id="tab-nomina">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:10px;">
      <div id="nomina-controls-extra" style="display:flex;gap:8px;align-items:center;">
        <button class="btn" onclick="openChangePwModal()" style="font-size:11px;padding:6px 14px;display:flex;align-items:center;gap:6px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Cambiar contrasena
        </button>
        <button class="btn" onclick="lockNomina()" style="font-size:11px;padding:6px 14px;color:var(--text3);">Cerrar sesion</button>
      </div>
    </div>
    <div class="nom-controls">
      <label>Periodo</label>
      <input type="date" id="nom-desde" onchange="renderNomina()">
      <span class="nom-sep">—</span>
      <input type="date" id="nom-hasta" onchange="renderNomina()">
      <button class="btn" onclick="setMesActual()">Mes actual</button>
    </div>
    <div id="nomina-content"></div>
  </div>
</div>

<div id="modal-container"></div>
<div class="toast" id="toast">Guardado</div>

<script>
const MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_SHORT = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS = ['Lun','Mar','Mie','Jue','Vie','Sab','Dom'];

const STAFF = [
  { id:0, name:'Sofia Plata',   suc:'Polanco', tipo:'fijo',  tarifa:0,  sueldo:7000,  admin:false },
  { id:1, name:'Caro',          suc:'Roma',    tipo:'fijo',  tarifa:0,  sueldo:23000, admin:true  },
  { id:2, name:'Valeria Anaya', suc:'Polanco', tipo:'fijo',  tarifa:0,  sueldo:1900,  admin:false },
  { id:3, name:'Sofia Cabrera', suc:'Roma',    tipo:'hora',  tarifa:57, sueldo:0,     admin:false },
  { id:4, name:'Giulia',        suc:'Roma',    tipo:'mixto', tarifa:57, sueldo:11000, admin:true, turnosFijos:['ROM-PM-LUN','ROM-AM-MIE','ROM-PM-MIE'] },
  { id:5, name:'Valeria Ceron', suc:'Roma',    tipo:'hora',  tarifa:57, sueldo:0,     admin:false },
  { id:6, name:'Ramon',         suc:'Ambas',   tipo:'socio', tarifa:0,  sueldo:0,     admin:false },
  { id:7, name:'Anna',          suc:'Ambas',   tipo:'owner', tarifa:0,  sueldo:0,     admin:false },
  { id:8, name:'Natalia',       suc:'Ambas',   tipo:'extra', tarifa:57, sueldo:0,     admin:false },
];

const TURNOS_HRS = {
  'POL-AM':5.5,'POL-PM':3.5,'ROM-AM':5.5,'ROM-AM-V':4.5,
  'ROM-PM':3.5,'FDS-POL':4.0,'FDS-ROM':4.0,'FDS-POL-S':4.5,'EVENTO':3.0
};

// Base schedule: weekday 0=Mon -> array of [turnoId, staffId|null]
const BASE_SCHED = {
  0:[['POL-AM',0],['POL-PM',6],['ROM-AM',3],['ROM-PM',4]],
  1:[['POL-AM',0],['POL-PM',2],['ROM-AM',1],['ROM-PM',6]],
  2:[['POL-AM',0],['POL-PM',6],['ROM-AM',4],['ROM-PM',4]],
  3:[['POL-AM',0],['POL-PM',2],['ROM-AM',1],['ROM-PM',6]],
  4:[['POL-AM',0],['ROM-AM-V',null]],
  5:[['FDS-POL',null],['FDS-ROM',5]],
  6:[['FDS-POL-S',0],['FDS-ROM',null]],
};

// State
// baseSchedule: permanent pattern (weekday -> slots)
// weekOverrides: { 'YYYY-WW': { weekday: { turnoId: { staffId, isSuplencia } } } }
// events: array
let baseSchedule = JSON.parse(JSON.stringify(BASE_SCHED));
let weekOverrides = {};
let events = [];
let weekOffset = 0;
let nominaUnlocked = false;
const NOMINA_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918'; // 'admin' default — change via settings
let pendingCell = null;

// ── Persistence ──────────────────────────────────────────────────────────────
function save() {
  try {
    localStorage.setItem('atma-base', JSON.stringify(baseSchedule));
    localStorage.setItem('atma-overrides', JSON.stringify(weekOverrides));
    localStorage.setItem('atma-events', JSON.stringify(events));
    const t = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('save-status').textContent = 'Guardado ' + t;
    showToast();
  } catch(e) {}
}
function load() {
  try {
    const b=localStorage.getItem('atma-base');
    const o=localStorage.getItem('atma-overrides');
    const e=localStorage.getItem('atma-events');
    if(b) baseSchedule=JSON.parse(b);
    if(o) weekOverrides=JSON.parse(o);
    if(e) events=JSON.parse(e);
    document.getElementById('save-status').textContent = b?'Datos cargados':'Plantilla base';
  } catch(e) { document.getElementById('save-status').textContent='Plantilla base'; }
}
function showToast() {
  const t=document.getElementById('toast'); t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ── Week key ─────────────────────────────────────────────────────────────────
function getWeekDates(off) {
  const now=new Date(), day=now.getDay();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(day===0?6:day-1)+off*7);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function weekKey(dates) {
  const d=dates[0];
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmt(d) { return d.getDate()+' '+MESES_SHORT[d.getMonth()]; }

// ── Slot resolution ───────────────────────────────────────────────────────────
// Returns {staffId, isSuplencia} for a given weekday+turnoId in current week
function resolveSlot(wk, wd, turnoId) {
  const matchTids = turnoId==='ROM-AM'?['ROM-AM','ROM-AM-V']:turnoId==='FDS-POL'?['FDS-POL','FDS-POL-S']:[turnoId];
  // Check override first
  const ovWk = weekOverrides[wk];
  if(ovWk && ovWk[wd]) {
    for(const mt of matchTids) {
      if(ovWk[wd][mt] !== undefined) return {...ovWk[wd][mt], tid: mt};
    }
  }
  // Fall back to base
  const baseDay = baseSchedule[wd]||[];
  const baseSlot = baseDay.find(([tid])=>matchTids.includes(tid));
  if(baseSlot) return {staffId: baseSlot[1], isSuplencia: false, tid: baseSlot[0]};
  return null;
}

function hasOverridesThisWeek(wk) {
  const ov=weekOverrides[wk];
  if(!ov) return false;
  return Object.keys(ov).length > 0;
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function showTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='nomina') {
    setMesActual();
    if(nominaUnlocked) renderNomina();
    else renderNominaLock();
  }
  if(tab==='events') renderEvents();
}

function changeWeek(dir) { weekOffset+=dir; render(); }

// ── Render ────────────────────────────────────────────────────────────────────
function calcStats(wk) {
  let vac=0, cub=0, hrs=0;
  const pagoIds=[3,4,5,8]; // Giulia(4) counts shifts even though she has fixed admin salary
  const rows = [
    {tid:'POL-AM',wds:[0,1,2,3,4]},{tid:'POL-PM',wds:[0,1,2,3]},
    {tid:'ROM-AM',wds:[0,1,2,3,4]},{tid:'ROM-PM',wds:[0,1,2,3]},
    {tid:'FDS-POL',wds:[5,6]},{tid:'FDS-ROM',wds:[5,6]},
  ];
  rows.forEach(row=>row.wds.forEach(wd=>{
    const sl=resolveSlot(wk,wd,row.tid);
    if(!sl) return;
    if(sl.staffId===null) vac++;
    else {
      cub++;
      if(pagoIds.includes(sl.staffId)) hrs+=(TURNOS_HRS[sl.tid]||0);
    }
  }));
  const fijoTotal=STAFF.filter(s=>s.tipo==='fijo').reduce((a,s)=>a+s.sueldo,0);
  return {vac,cub,hrs:hrs*4,nomEst:fijoTotal+hrs*4*57};
}

function eventsThisWeek(dates) {
  if(!dates||!dates.length) return [];
  const start=dates[0], end=dates[6];
  start.setHours(0,0,0,0); end.setHours(23,59,59,999);
  return events.filter(ev=>{
    const d=new Date(ev.fecha+'T12:00:00');
    return d>=start && d<=end;
  });
}

  const regularRows = ROWS.map(row=>{

  // Event rows — one row per special event this week
  const eventRows = weekEvRows.length ? `
    <div class="sched-row" style="background:rgba(168,172,139,0.07)">
      <div class="row-lbl" colspan="8" style="grid-column:1/-1;background:rgba(168,172,139,0.12);border-top:1px solid rgba(168,172,139,0.3)">

function slotHTML(tid, sid) {
  if(sid===null) return `<span class="slot slot-vacant">&#9888; Vacante</span>`;
  const s=STAFF[sid], name=s.name.split(' ')[0];
  if(s.tipo==='owner') return `<span class="slot slot-owner">${name}</span>`;
  if(s.tipo==='socio') return `<span class="slot slot-socio">${name}</span>`;
  if(s.tipo==='extra') return `<span class="slot slot-extra">${name}</span>`;
  if(s.tipo==='fijo')  return `<span class="slot slot-fijo">${name}</span>`;
  const isRoma=tid.startsWith('ROM')||tid==='FDS-ROM';
  return `<span class="slot ${isRoma?'slot-hora-rom':'slot-hora-pol'}">${name}</span>`;
}

// ── Modal asignar turno ───────────────────────────────────────────────────────
function buildOptions(currentSid) {
  const grupos=[
    {label:'Equipo fijo',tipos:['fijo']},
    {label:'Por hora',tipos:['hora']},
    {label:'Sin costo',tipos:['socio','owner']},
    {label:'Apoyo eventual',tipos:['extra']},
  ];
  return grupos.map(g=>{
    const ms=STAFF.filter(s=>g.tipos.includes(s.tipo));
    if(!ms.length) return '';
    return `<optgroup label="${g.label}">${ms.map(s=>`<option value="${s.id}" ${currentSid===s.id?'selected':''}>${s.name}</option>`).join('')}</optgroup>`;
  }).join('');
}

function openModal(wk, wd, turnoType) {
  pendingCell={wk,wd,turnoType};
  const sl=resolveSlot(wk,wd,turnoType);
  const currentSid=sl?sl.staffId:null;
  const isSup=sl?sl.isSuplencia:false;

  // Check if there's a base assignment to warn about
  const matchTids=turnoType==='ROM-AM'?['ROM-AM','ROM-AM-V']:turnoType==='FDS-POL'?['FDS-POL','FDS-POL-S']:[turnoType];
  const baseSlot=(baseSchedule[wd]||[]).find(([tid])=>matchTids.includes(tid));
  const hasBase=baseSlot&&baseSlot[1]!==null;
  const baseName=hasBase?STAFF[baseSlot[1]].name:'';

  document.getElementById('modal-container').innerHTML=`
    <div class="modal-bg" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Asignar turno</h3>
        <p class="modal-sub">${DIAS[wd]} &middot; ${turnoType.replace(/-/g,' ')}</p>
        ${hasBase?`<div class="info-box">Turno base asignado a <strong>${baseName}</strong>. Si marcas como suplencia, solo afecta esta semana y el patron base se conserva.</div>`:''}
        <div class="form-group">
          <label>Persona asignada</label>
          <select id="modal-select">
            <option value="vacant">Dejar vacante</option>
            ${buildOptions(currentSid)}
          </select>
        </div>
        <div class="toggle-wrap">
          <label>Marcar como suplencia temporal<br><span style="font-size:11px;color:var(--text3)">Solo afecta esta semana. El patron base no cambia.</span></label>
          <label class="toggle"><input type="checkbox" id="modal-sup" ${isSup?'checked':''}><span class="toggle-slider"></span></label>
        </div>
        <div class="modal-btns">
          <button class="btn" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="applyModal()">Guardar</button>
        </div>
      </div>
    </div>`;
}

function closeModal(e) {
  if(e&&e.target!==e.currentTarget) return;
  document.getElementById('modal-container').innerHTML='';
  pendingCell=null;
}

function applyModal() {
  if(!pendingCell) return;
  const {wk,wd,turnoType}=pendingCell;
  const val=document.getElementById('modal-select').value;
  const sid=val==='vacant'?null:parseInt(val);
  const isSup=document.getElementById('modal-sup').checked;

  const matchTids=turnoType==='ROM-AM'?['ROM-AM','ROM-AM-V']:turnoType==='FDS-POL'?['FDS-POL','FDS-POL-S']:[turnoType];
  const useTid=wd===4&&turnoType==='ROM-AM'?'ROM-AM-V':wd===6&&turnoType==='FDS-POL'?'FDS-POL-S':turnoType;

  if(isSup) {
    // Save as weekly override only
    if(!weekOverrides[wk]) weekOverrides[wk]={};
    if(!weekOverrides[wk][wd]) weekOverrides[wk][wd]={};
    weekOverrides[wk][wd][useTid]={staffId:sid, isSuplencia:true};
  } else {
    // Update base schedule (permanent)
    const baseDay=baseSchedule[wd]||[];
    const idx=baseDay.findIndex(([tid])=>matchTids.includes(tid));
    if(idx>=0) {
      if(sid===null&&turnoType==='EVENTO') baseDay.splice(idx,1);
      else baseDay[idx]=[useTid,sid];
    } else {
      if(!(sid===null&&turnoType==='EVENTO')) baseDay.push([useTid,sid]);
    }
    baseSchedule[wd]=baseDay;
    // Also clear any override for this slot this week
    if(weekOverrides[wk]&&weekOverrides[wk][wd]) {
      matchTids.forEach(mt=>delete weekOverrides[wk][wd][mt]);
    }
  }

  document.getElementById('modal-container').innerHTML='';
  pendingCell=null;
  save(); render();
}

function saveEvent(editIdx) {
  const nombre=document.getElementById('ev-n').value.trim();
  const fecha=document.getElementById('ev-f').value;
  const suc=document.getElementById('ev-s').value;
  const hrs=parseFloat(document.getElementById('ev-h').value)||0;

// ── Nomina ────────────────────────────────────────────────────────────────────
function setMesActual() {
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth();
  const pad=n=>String(n).padStart(2,'0');
  document.getElementById('nom-desde').value=`${y}-${pad(m+1)}-01`;
  const lastDay=new Date(y,m+1,0).getDate();
  document.getElementById('nom-hasta').value=`${y}-${pad(m+1)}-${pad(lastDay)}`;
  renderNomina();
}

function getWeeksInRange(desde, hasta) {
  // Get all week keys that overlap with the date range
  const start=new Date(desde+'T12:00:00');
  const end=new Date(hasta+'T12:00:00');
  const weeks=[];
  const cur=new Date(start);
  // Snap to Monday
  const day=cur.getDay(); cur.setDate(cur.getDate()-(day===0?6:day-1));
  while(cur<=end) {
    const wk=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    weeks.push({wk, mon:new Date(cur)});
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}

function renderNomina() {
  const desde=document.getElementById('nom-desde')?.value;
  const hasta=document.getElementById('nom-hasta')?.value;
  if(!desde||!hasta) return;

  const weeks=getWeeksInRange(desde,hasta);
  const startDate=new Date(desde+'T00:00:00');
  const endDate=new Date(hasta+'T23:59:59');

  // Tally hours per person per week, only counting days within range
  const horaIds=[3,4,5,8];
  const hrsMap={};
  STAFF.forEach(s=>{hrsMap[s.id]=0;});

  const ROWS=[
    {tid:'POL-AM',wds:[0,1,2,3,4]},{tid:'POL-PM',wds:[0,1,2,3]},
    {tid:'ROM-AM',wds:[0,1,2,3,4]},{tid:'ROM-PM',wds:[0,1,2,3]},
    {tid:'FDS-POL',wds:[5,6]},{tid:'FDS-ROM',wds:[5,6]},
  ];

  // Giulia's fixed shifts (included in $11,000): Mon ROM-PM, Wed ROM-AM, Wed ROM-PM
  const giuliaFixedSlots = new Set(['0-ROM-PM','2-ROM-AM','2-ROM-PM']); // wd-tid

  weeks.forEach(({wk, mon})=>{
    ROWS.forEach(row=>row.wds.forEach(wd=>{
      const dayDate=new Date(mon); dayDate.setDate(mon.getDate()+wd);
      if(dayDate<startDate||dayDate>endDate) return;
      const sl=resolveSlot(wk,wd,row.tid);
      if(!sl||sl.staffId===null) return;
      if(!horaIds.includes(sl.staffId)) return;
      // Skip Giulia's fixed shifts — they're included in her $11,000
      const baseTid = sl.tid.replace('-V',''); // normalize ROM-AM-V -> ROM-AM
      if(sl.staffId===4 && giuliaFixedSlots.has(wd+'-'+baseTid)) return;
      hrsMap[sl.staffId]+=(TURNOS_HRS[sl.tid]||0);
    }));
  });

  // Events in range
  const evInRange=events.filter(ev=>{
    const d=new Date(ev.fecha+'T12:00:00');
    return d>=startDate&&d<=endDate;
  });
  const evMap={};
  evInRange.forEach(ev=>ev.staffIds.forEach(id=>{
    if(!evMap[id]) evMap[id]=0; evMap[id]+=ev.pagoXPersona;
  }));

  // Staff by category
  const adminFijoStaff = STAFF.filter(s=>(s.tipo==='fijo'||s.tipo==='mixto')&&s.admin);
  const recepFijoStaff = STAFF.filter(s=>s.tipo==='fijo'&&!s.admin);
  const horaStaff      = STAFF.filter(s=>s.tipo==='hora'||s.tipo==='extra'||s.tipo==='mixto');
  const sinCosto       = STAFF.filter(s=>s.tipo==='socio'||s.tipo==='owner');

  // Pro-rate fixed salaries based on days in range vs full month
  const totalDays=Math.round((endDate-startDate)/86400000)+1;
  const daysInMonth=new Date(startDate.getFullYear(),startDate.getMonth()+1,0).getDate();
  const ratio=Math.min(totalDays/daysInMonth,1);

  const totalEv=Object.values(evMap).reduce((a,v)=>a+v,0);

  const fD=new Date(desde+'T12:00:00'), fH=new Date(hasta+'T12:00:00');
  const periodoStr=`${fD.getDate()} ${MESES_SHORT[fD.getMonth()]} – ${fH.getDate()} ${MESES_SHORT[fH.getMonth()]} ${fH.getFullYear()}`;

  // Totals per category
  const totalAdminFijos = adminFijoStaff.reduce((a,s)=>a+Math.round(s.sueldo*ratio),0);
  const totalRecepFijos  = recepFijoStaff.reduce((a,s)=>a+Math.round(s.sueldo*ratio),0);
  const totalRecepHoras  = horaStaff.reduce((a,s)=>{
    // Giulia's shifts go into recepcion column, NOT into her admin total
    return a+Math.round(hrsMap[s.id]*s.tarifa);
  },0);
  const totalFijosAll    = totalAdminFijos+totalRecepFijos;
  const totalNomina      = totalFijosAll+totalRecepHoras+totalEv;
  const totalAdmin       = totalAdminFijos+(evMap[1]||0)+(evMap[4]?Math.round((evMap[4]||0)):0);
  const totalRecep       = totalRecepFijos+totalRecepHoras+
    horaStaff.filter(s=>!s.admin).reduce((a,s)=>a+(evMap[s.id]||0),0)+
    (evMap[4]||0); // Giulia event pay goes to recep if she's working a shift event

  const sectionStyle = "background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:16px;";
  const sectionTitleStyle = "font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;margin-bottom:4px;";
  const sectionSubStyle = "font-size:11px;color:var(--text3);letter-spacing:0.5px;margin-bottom:16px;";
  const totalLineStyle = "display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border2);margin-top:8px;";

  const totalNominaSummary = totalAdminFijos + Math.round(totalRecepFijos*ratio) +
    horaStaff.reduce((a,s)=>a+Math.round(hrsMap[s.id]*s.tarifa),0) + totalEv;

  document.getElementById('nomina-content').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;">
      <div class="stat accent" style="grid-column:1/-1">
        <div class="stat-label">Nomina total estimada del periodo</div>
        <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;">
          <div class="stat-value">$${Math.round(totalNomina).toLocaleString('es-MX')}</div>
          <div class="desglose" style="margin:0">
            <span style="display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;border-radius:2px;background:var(--accent);display:inline-block"></span>Admin $${Math.round(totalAdminFijos).toLocaleString('es-MX')}</span>
            <span style="display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;border-radius:2px;background:var(--sage);display:inline-block"></span>Recepcion $${Math.round(totalRecepFijos+totalRecepHoras).toLocaleString('es-MX')}</span>
            ${totalEv?`<span>+ Eventos $${Math.round(totalEv).toLocaleString('es-MX')}</span>`:''}
          </div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px;">${periodoStr} &nbsp;·&nbsp; ${weeks.length} semana${weeks.length!==1?'s':''}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div style="background:rgba(193,147,123,0.08);border:1px solid rgba(193,147,123,0.2);border-radius:var(--radius-lg);padding:16px 20px;">
        <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;">Administracion</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--accent2);">$${Math.round(totalAdminFijos+(evMap[1]||0)).toLocaleString('es-MX')}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:3px;">Caro + Giulia (sueldo fijo)</div>
      </div>
      <div style="background:var(--sage-dim);border:1px solid rgba(168,172,139,0.3);border-radius:var(--radius-lg);padding:16px 20px;">
        <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;">Recepcion / Front desk</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:#5A7055;">$${Math.round(totalRecepFijos+totalRecepHoras).toLocaleString('es-MX')}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:3px;">Turnos + sueldos fijos recepcion</div>
      </div>
    </div>

    <div style="${sectionStyle}">
      <div style="${sectionTitleStyle}">Administracion y Marketing</div>
      <div style="${sectionSubStyle}">Sueldos fijos administrativos · no incluye turnos de recepcion</div>
      <table class="nom-table">
        <thead><tr><th>Persona</th><th>Concepto</th><th>Sueldo fijo</th><th>Eventos extra</th><th>Total</th></tr></thead>
        <tbody>
          ${adminFijoStaff.map(s=>{
            const base=Math.round(s.sueldo*ratio), ev=evMap[s.id]||0;
            const nota=s.id===4?'Marketing + coordinacion':'Coordinacion operativa + admin';
            return `<tr>
              <td><strong>${s.name}</strong><br><span style="font-size:11px;color:var(--text3)">${nota}</span></td>
              <td><span class="pill" style="background:rgba(193,147,123,0.15);color:var(--accent2)">Fijo admin</span></td>
              <td>$${base.toLocaleString('es-MX')}</td>
              <td>${ev?'$'+Math.round(ev).toLocaleString('es-MX'):'—'}</td>
              <td style="font-weight:500">$${(base+ev).toLocaleString('es-MX')}</td>
            </tr>`;}).join('')}
        </tbody>
      </table>
      <div style="${totalLineStyle}">
        <span style="font-size:12px;color:var(--text3)">Subtotal administracion</span>
        <span style="font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--accent2)">$${Math.round(totalAdminFijos+(evMap[1]||0)).toLocaleString('es-MX')}</span>
      </div>
    </div>

    <div style="${sectionStyle}">
      <div style="${sectionTitleStyle}">Recepcion y Front Desk</div>
      <div style="${sectionSubStyle}">Turnos cubiertos + sueldos fijos de recepcion</div>
      <table class="nom-table">
        <thead><tr><th>Persona</th><th>Tipo</th><th>Sueldo fijo</th><th>Horas turno</th><th>Subtotal turnos</th><th>Eventos</th><th>Total</th></tr></thead>
        <tbody>
          ${recepFijoStaff.map(s=>{
            const base=Math.round(s.sueldo*ratio), ev=evMap[s.id]||0;
            return `<tr>
              <td>${s.name}</td>
              <td><span class="pill" style="background:rgba(210,199,197,0.5);color:var(--c1)">Fijo recep</span></td>
              <td>$${base.toLocaleString('es-MX')}</td>
              <td style="color:var(--text3)">—</td>
              <td style="color:var(--text3)">—</td>
              <td>${ev?'$'+Math.round(ev).toLocaleString('es-MX'):'—'}</td>
              <td style="font-weight:500">$${(base+ev).toLocaleString('es-MX')}</td>
            </tr>`;}).join('')}
          ${horaStaff.map(s=>{
            const h=hrsMap[s.id], sub=Math.round(h*s.tarifa), ev=evMap[s.id]||0, tot=sub+ev;
            const isGiulia=s.id===4;
            return `<tr>
              <td>${s.name}${isGiulia?'<br><span style="font-size:11px;color:var(--text3)">Lun/Mie ROM-AM/PM incluidos en fijo · extras a $57/hr</span>':''}</td>
              <td><span class="pill" style="background:var(--sage-dim);color:#5A7055">$${s.tarifa}/hr</span></td>
              <td style="color:var(--text3)">—</td>
              <td>${h.toFixed(1)} hrs</td>
              <td>${sub>0?'$'+sub.toLocaleString('es-MX'):'—'}</td>
              <td>${ev?'$'+Math.round(ev).toLocaleString('es-MX'):'—'}</td>
              <td style="font-weight:500">${tot>0?'$'+tot.toLocaleString('es-MX'):'—'}</td>
            </tr>`;}).join('')}
        </tbody>
      </table>
      <div style="${totalLineStyle}">
        <span style="font-size:12px;color:var(--text3)">Subtotal recepcion</span>
        <span style="font-family:'Cormorant Garamond',serif;font-size:20px;color:#5A7055">$${Math.round(totalRecepFijos+totalRecepHoras).toLocaleString('es-MX')}</span>
      </div>
    </div>

    ${sinCosto.length?`<div style="${sectionStyle}">
      <div style="${sectionTitleStyle}">Sin costo en nomina</div>
      <table class="nom-table">
        <thead><tr><th>Persona</th><th>Rol</th><th>Nota</th></tr></thead>
        <tbody>${sinCosto.map(s=>`<tr>
          <td>${s.name}</td>
          <td><span class="pill" style="${s.tipo==='owner'?'background:var(--green-dim);color:var(--green)':'background:rgba(136,122,95,0.12);color:var(--c2)'}">${s.tipo==='owner'?'Duena':'Socio'}</span></td>
          <td style="color:var(--text3);font-size:12px">${s.tipo==='owner'?'Cubre turnos sin costo en nomina':'Socio — cubre turnos sin costo'}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`:''}

    <div class="divider"></div>
    <div class="total-banner">
      <div>
        <div class="lbl">Total nomina del periodo</div>
        <div class="periodo">${periodoStr} &nbsp;·&nbsp; ${weeks.length} semana${weeks.length!==1?'s':''}</div>
        <div class="desglose">
          <span style="display:flex;align-items:center;gap:4px;">
            <span style="width:8px;height:8px;border-radius:2px;background:var(--accent);display:inline-block"></span>
            Admin $${Math.round(totalAdminFijos).toLocaleString('es-MX')}
          </span>
          <span style="display:flex;align-items:center;gap:4px;">
            <span style="width:8px;height:8px;border-radius:2px;background:var(--sage);display:inline-block"></span>
            Recepcion $${Math.round(totalRecepFijos+totalRecepHoras).toLocaleString('es-MX')}
          </span>
          ${totalEv?`<span>+ Eventos $${Math.round(totalEv).toLocaleString('es-MX')}</span>`:''}
        </div>
      </div>
      <div class="val">$${Math.round(totalNomina).toLocaleString('es-MX')}</div>
    </div>`;
}

function printCalendar() {
  const wl = document.getElementById('week-label').textContent;
  const orig = document.title;
  document.title = 'Atma Yoga - Turnos ' + wl;
  window.print();
  document.title = orig;
}

async function hashPassword(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function getSavedHash() {
  return localStorage.getItem('atma-nomina-hash') || NOMINA_HASH;
}

function lockNomina() {
  nominaUnlocked = false;
  // If currently on nomina tab, go back to calendar
  const nomTab = document.getElementById('tab-nomina');
  if(nomTab && nomTab.classList.contains('active')) {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelector('.tab').classList.add('active');
    document.getElementById('tab-calendar').classList.add('active');
  }
  renderNominaLock();
}

function renderNominaLock() {
  document.getElementById('nomina-content').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;text-align:center;">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(193,147,123,0.12);border:1px solid rgba(193,147,123,0.25);display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2 style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;margin-bottom:8px;">Nomina protegida</h2>
      <p style="font-size:13px;color:var(--text3);margin-bottom:2rem;max-width:320px;">Esta seccion es privada. Ingresa la contrasena para ver los datos de nomina.</p>
      <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;">
        <input type="password" id="nomina-pw" placeholder="Contrasena" onkeydown="if(event.key==='Enter')unlockNomina()"
          style="background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 14px;font-size:14px;color:var(--text);font-family:'Jost',sans-serif;text-align:center;letter-spacing:3px;">
        <button class="btn btn-primary" onclick="unlockNomina()">Entrar</button>
        <p id="pw-error" style="font-size:12px;color:var(--red);display:none;">Contrasena incorrecta</p>
      </div>
    </div>`;
  setTimeout(()=>{ const el=document.getElementById('nomina-pw'); if(el) el.focus(); },100);
}

async function unlockNomina() {
  const pw = document.getElementById('nomina-pw')?.value || '';
  const hash = await hashPassword(pw);
  if(hash === getSavedHash()) {
    nominaUnlocked = true;
    document.getElementById('pw-error').style.display='none';
    renderNomina();
    // Show change password option
    const controls = document.getElementById('nomina-controls-extra');
    if(controls) controls.style.display='flex';
  } else {
    document.getElementById('pw-error').style.display='block';
    document.getElementById('nomina-pw').value='';
    document.getElementById('nomina-pw').focus();
  }
}

function openChangePwModal() {
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-bg" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Cambiar contrasena</h3>
        <p class="modal-sub">La nueva contrasena protegera la seccion de nomina.</p>
        <div class="form-group"><label>Contrasena actual</label>
          <input type="password" id="pw-old" style="letter-spacing:2px">
        </div>
        <div class="form-group"><label>Nueva contrasena</label>
          <input type="password" id="pw-new" style="letter-spacing:2px">
        </div>
        <div class="form-group"><label>Confirmar nueva contrasena</label>
          <input type="password" id="pw-new2" style="letter-spacing:2px">
        </div>
        <p id="pw-change-error" style="font-size:12px;color:var(--red);display:none;margin-bottom:10px;"></p>
        <div class="modal-btns">
          <button class="btn" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="saveNewPassword()">Guardar contrasena</button>
        </div>
      </div>
    </div>`;
}

async function saveNewPassword() {
  const oldPw = document.getElementById('pw-old').value;
  const newPw = document.getElementById('pw-new').value;
  const newPw2 = document.getElementById('pw-new2').value;
  const errEl = document.getElementById('pw-change-error');
  if(!oldPw||!newPw||!newPw2){ errEl.textContent='Completa todos los campos.'; errEl.style.display='block'; return; }
  if(newPw !== newPw2){ errEl.textContent='Las contrasenas nuevas no coinciden.'; errEl.style.display='block'; return; }
  if(newPw.length < 4){ errEl.textContent='La contrasena debe tener al menos 4 caracteres.'; errEl.style.display='block'; return; }
  const oldHash = await hashPassword(oldPw);
  if(oldHash !== getSavedHash()){ errEl.textContent='La contrasena actual es incorrecta.'; errEl.style.display='block'; return; }
  const newHash = await hashPassword(newPw);
  localStorage.setItem('atma-nomina-hash', newHash);
  closeModal();
  showToast();
}

load();
render();
</script>
</body>
</html>
